services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    env_file:
      - ${OPENWEBUI_ENV_FILE:-/etc/hermes/openwebui.env}
    environment:
      - TZ=America/Chicago
      - PORT=8080
      - ENABLE_OLLAMA_API=false
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - ENABLE_WEB_SEARCH=true
      - WEB_SEARCH_ENGINE=firecrawl
      - FIRECRAWL_API_BASE_URL=http://firecrawl-guard:3003
      - WEBUI_URL=https://chat.teva.services
      - ENABLE_OAUTH_SIGNUP=true
      - ENABLE_LOGIN_FORM=false
      - OAUTH_PROVIDER_NAME=Zitadel
      - OPENID_PROVIDER_URL=https://login.tevaservices.com/.well-known/openid-configuration
      - OPENID_REDIRECT_URI=https://chat.teva.services/oauth/callback
      - OAUTH_SCOPES=openid email profile
      - OAUTH_ALLOWED_DOMAINS=tevaservices.com
      - DEFAULT_USER_ROLE=user
      - ADMIN_EMAIL=bryan@tevaservices.com
      - ANONYMIZED_TELEMETRY=false
      - DO_NOT_TRACK=true
      - SCARF_NO_ANALYTICS=true
    volumes:
      - open-webui-data:/app/backend/data
    ports:
      - "127.0.0.1:8080:8080"
    networks: [hermes-net]

  # The NetBird reverse proxy dials the host's NetBird address, not loopback.
  # Bind only the mesh address and forward to the container's loopback publish.
  openwebui-forwarder:
    image: alpine/socat
    container_name: openwebui-forwarder
    restart: unless-stopped
    network_mode: host
    command:
      - TCP-LISTEN:8080,bind=100.91.204.199,fork,reuseaddr
      - TCP:127.0.0.1:8080

volumes:
  # Explicitly pinned to the existing Open WebUI state volume. Renaming it
  # starts chat history from scratch.
  open-webui-data:
    name: openwebui_open-webui-data

networks:
  hermes-net:
    external: true
    name: hermes-net
